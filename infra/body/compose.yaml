# Local pilot infrastructure. Put credentials in .env.local (never commit it).
# Production requires private networks, TLS, managed secrets, and pinned images.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: form_body
      POSTGRES_USER: form
      POSTGRES_PASSWORD: ${BODY_POSTGRES_PASSWORD:?Set BODY_POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form -d form_body"]
      interval: 5s
      retries: 10
  objects:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["object-data:/data"]
  worker:
    build: ../../workers/body
    env_file: ../../.env.local
    environment:
      BODY_DATABASE_URL: postgresql://form:${BODY_POSTGRES_PASSWORD}@postgres:5432/form_body
      BODY_S3_ENDPOINT: http://objects:9000
    depends_on:
      postgres: { condition: service_healthy }
      objects: { condition: service_started }
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,nodev,size=3g,uid=10001,gid=10001", "/home/worker:rw,nosuid,nodev,size=64m,uid=10001,gid=10001"]
    mem_limit: 6g
    cpus: 4
    pids_limit: 128
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
volumes:
  postgres-data:
  object-data:
