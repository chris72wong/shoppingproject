name: FormCapture
options:
  bundleIdPrefix: studio.form
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FormCapture:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: FORM Capture
        UILaunchScreen: {}
        NSCameraUsageDescription: Capture a private depth scan for your personal body preview.
        CFBundleURLTypes:
          - CFBundleURLName: studio.form.capture
            CFBundleURLSchemes: [formcapture]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arkit]
